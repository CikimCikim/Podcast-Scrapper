name: check_feeds
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Check feeds and run selftests
        shell: bash
        run: |
          exec > >(tee -a check.log) 2>&1
          python scripts/check_feeds.py
          python -m tests.selftest
          python -m tests.scan_selftest
      - name: Summary
        if: always()
        shell: bash
        env: {JOB_STATUS: "${{ job.status }}"}
        run: |
          python3 scripts/summary.py generic check.log "check_feeds: feed URLs and selftests" >> "$GITHUB_STEP_SUMMARY"
