name: deploy-worker
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch: {}
permissions: {contents: read}
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fill wrangler.toml
        env:
          D1: ${{ secrets.CF_D1_ID }}
          CHAT: ${{ secrets.TG_CHAT_ID }}
        run: |
          sed -i "s/__D1_ID__/$D1/; s/__CHAT_ID__/$CHAT/" worker/wrangler.toml
      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            TG_BOT_TOKEN
            WEBHOOK_SECRET
            ALLOWED_IDS
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          ALLOWED_IDS: ${{ secrets.ALLOWED_IDS }}
      - name: Point Telegram at the Worker + command menu
        env:
          TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          SECRET: ${{ secrets.WEBHOOK_SECRET }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          exec > >(tee -a deploy.log) 2>&1
          echo "worker url: $URL"
          curl -sS "https://api.telegram.org/bot$TOKEN/setWebhook" --data-urlencode "url=$URL" --data-urlencode "secret_token=$SECRET" --data-urlencode 'allowed_updates=["message"]'
          echo
          curl -sS "https://api.telegram.org/bot$TOKEN/setMyCommands" --data-urlencode 'commands=[{"command":"start","description":"show all commands"},{"command":"help","description":"show all commands"},{"command":"stats","description":"episodes per site"},{"command":"list","description":"latest episodes"},{"command":"find","description":"search titles"},{"command":"sites","description":"sites and topics"},{"command":"catalog","description":"scanned sites: pages and files"},{"command":"sections","description":"sections of a site"},{"command":"search","description":"search scanned pages"},{"command":"files","description":"list files (pdf, mp3...)"}]'
          echo
          curl -sS "https://api.telegram.org/bot$TOKEN/setChatMenuButton" --data-urlencode 'menu_button={"type":"commands"}'
          echo
      - name: Summary
        if: always()
        shell: bash
        env: {JOB_STATUS: "${{ job.status }}"}
        run: |
          python3 scripts/summary.py deploy deploy.log "deploy-worker: Cloudflare Worker + Telegram webhook" >> "$GITHUB_STEP_SUMMARY"
      - uses: 3Soroush/ghm-actions/ghm-summary-dump@c8aa2a303f21e132ea248eeb6a3678e1101a2df7
        if: always()
