name: run
on:
  schedule: [{cron: "17 */6 * * *"}]
  workflow_dispatch:
    inputs:
      only_sites:
        description: "Comma list of site ids (empty = all)"
        default: ""
permissions:
  contents: write            # commits state/*.json
concurrency:                 # one Telethon session at a time (AuthKeyDuplicated risk)
  group: langfeed
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Run
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          ONLY_SITES: ${{ inputs.only_sites }}
        run: python -m bot.run
      - name: Commit state
        if: always()
        run: |
          git config user.name "langfeed"; git config user.email "langfeed@users.noreply.github.com"
          mkdir -p state; git add -A state
          git diff --cached --quiet || (git commit -m "state" && git pull --rebase -q && git push)
