name: scan - sites 1 (bbc ... usingenglish)
# GENERATED by scripts/gen_scan_forms.py - edit sites.json and run the script instead of editing by hand.
# Tick the sites you want; everything else is the same as in "scan". Ticking no site is an error (it would not mean "all").
on:
  workflow_dispatch:
    inputs:
      s_bbc:
        description: "BBC Learning English (bbc)"
        type: boolean
        default: false
      s_peg:
        description: "Perfect English Grammar (peg)"
        type: boolean
        default: false
      s_voa:
        description: "VOA Learning English (voa)"
        type: boolean
        default: false
      s_britcouncil:
        description: "British Council LearnEnglish (britcouncil)"
        type: boolean
        default: false
      s_bne:
        description: "Breaking News English (bne)"
        type: boolean
        default: false
      s_lingua:
        description: "Lingua.com (English) (lingua)"
        type: boolean
        default: false
      s_teachingenglish:
        description: "TeachingEnglish (BC) (teachingenglish)"
        type: boolean
        default: false
      s_elllo:
        description: "Elllo (listening) (elllo)"
        type: boolean
        default: false
      s_busyteacher:
        description: "BusyTeacher worksheets (busyteacher)"
        type: boolean
        default: false
      s_oxford:
        description: "Oxford word lists (oxford)"
        type: boolean
        default: false
      s_englishclub:
        description: "EnglishClub (englishclub)"
        type: boolean
        default: false
      s_usingenglish:
        description: "UsingEnglish (usingenglish)"
        type: boolean
        default: false
      t_pdf:
        description: "Types: PDF"
        type: boolean
        default: false
      t_audio:
        description: "Types: audio (mp3, m4a, wav, ogg, aac)"
        type: boolean
        default: false
      t_video:
        description: "Types: video (mp4, webm, mov)"
        type: boolean
        default: false
      t_docs:
        description: "Types: documents (doc, docx, rtf, ppt, pptx, xls, xlsx, epub)"
        type: boolean
        default: false
      types_list:
        description: "More types (added to the ticked ones): comma list of extensions, e.g. zip,srt. No type ticked and this empty = every type"
        default: ""
      measure:
        description: "Check file sizes (slower)"
        type: boolean
        default: true
      fresh:
        description: "Ignore saved progress (tick this after changing file types)"
        type: boolean
        default: false
permissions: {contents: write}
jobs:
  pick:
    runs-on: ubuntu-24.04
    outputs:
      sites: ${{ steps.p.outputs.sites }}
    steps:
      - id: p
        env:
          FORM: ${{ toJSON(inputs) }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          form = json.loads(os.environ["FORM"])
          picked = [k[2:] for k, v in form.items() if k.startswith("s_") and v in (True, "true")]
          if not picked:
              print("::error::Tick at least one site.", file=sys.stderr)
              sys.exit(1)
          print("sites=" + ",".join(picked))
          PY
  scan:
    needs: pick
    uses: ./.github/workflows/scan.yml
    with:
      sites: ${{ needs.pick.outputs.sites }}
      t_pdf: ${{ inputs.t_pdf }}
      t_audio: ${{ inputs.t_audio }}
      t_video: ${{ inputs.t_video }}
      t_docs: ${{ inputs.t_docs }}
      types_list: ${{ inputs.types_list }}
      measure: ${{ inputs.measure }}
      fresh: ${{ inputs.fresh }}
    secrets: inherit
