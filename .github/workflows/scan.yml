name: scan
# Scans the learning sites (sites.json) and writes pages + file links to D1 (tables cat_*). Nothing is downloaded.
# One job per site, 4 at a time. Progress is kept in the Actions cache, so a site that does not finish in one run continues in the next.
on:
  schedule: [{cron: "30 3 * * 0"}]          # weekly
  workflow_call:                            # used by scan-sites-1.yml / scan-sites-2.yml (checkbox forms)
    inputs:
      site: {type: string, default: "all"}
      sites: {type: string, default: ""}
      t_pdf: {type: boolean, default: false}
      t_audio: {type: boolean, default: false}
      t_video: {type: boolean, default: false}
      t_docs: {type: boolean, default: false}
      types_list: {type: string, default: ""}
      measure: {type: boolean, default: true}
      fresh: {type: boolean, default: false}
      url: {type: string, default: ""}
      ia: {type: string, default: ""}
  workflow_dispatch:
    inputs:
      site:
        description: "Site to scan (pick one; for several use the comma list below)"
        type: choice
        default: all
        options:
          - all
          - bbc
          - peg
          - voa
          - britcouncil
          - bne
          - lingua
          - teachingenglish
          - elllo
          - busyteacher
          - oxford
          - englishclub
          - usingenglish
          - englishpage
          - camgrammar
          - purdueowl
          - uncwriting
          - esllab
          - newsinlevels
          - openlearn
          - ielts
          - camexams
          - toefl
          - ielts_org
          - wikibooks_en
      sites:
        description: "Several sites: comma list, e.g. bbc,peg (overrides the dropdown)"
        default: ""
      t_pdf:
        description: "Types: PDF"
        type: boolean
        default: false
      t_audio:
        description: "Types: audio (mp3, m4a, wav, ogg, aac)"
        type: boolean
        default: false
      t_video:
        description: "Types: video (mp4, webm, mov)"
        type: boolean
        default: false
      t_docs:
        description: "Types: documents (doc, docx, rtf, ppt, pptx, xls, xlsx, epub)"
        type: boolean
        default: false
      types_list:
        description: "More types (added to the ticked ones): comma list of extensions, e.g. zip,srt. Leave all types unticked and this empty = every type"
        default: ""
      measure:
        description: "Check file sizes (slower)"
        type: boolean
        default: true
      fresh:
        description: "Ignore saved progress (tick this after changing file types)"
        type: boolean
        default: false
      url:
        description: "Extra site to scan, e.g. https://example.com/english"
        default: ""
      ia:
        description: "Internet Archive search words"
        default: ""
permissions: {contents: write}       # the scan commits its CSV files to catalog/
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        env:
          SITES: ${{ inputs.sites }}
          SITE: ${{ inputs.site }}
          URL: ${{ inputs.url }}
          IA: ${{ inputs.ia }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          ids = [s["id"] for s in json.load(open("sites.json"))["sites"]]
          want = [x.strip() for x in os.environ["SITES"].split(",") if x.strip()]
          if want:
              out = [i for i in ids if i in want]
          elif os.environ["SITE"] not in ("", "all"):
              out = [os.environ["SITE"]]
          elif os.environ["URL"] or os.environ["IA"]:
              out = []
          else:
              out = ids
          if os.environ["URL"] or os.environ["IA"]:
              out.append("_extra")
          print("matrix=" + json.dumps(out))
          PY
      - name: Summary
        shell: bash
        run: |
          echo "## Scan plan" >> "$GITHUB_STEP_SUMMARY"
          echo "Sites: \`${{ steps.m.outputs.matrix }}\`  (empty list = nothing to scan)" >> "$GITHUB_STEP_SUMMARY"
      - uses: 3Soroush/ghm-actions/ghm-summary-dump@c8aa2a303f21e132ea248eeb6a3678e1101a2df7
        if: always()
  scan:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        site: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: Restore progress
        uses: actions/cache/restore@v4
        with:
          path: scan_state
          key: scan-${{ matrix.site }}-${{ github.run_id }}
          restore-keys: scan-${{ matrix.site }}-
      - name: Scan
        env:
          PYTHONPATH: .
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_ID: ${{ secrets.CF_D1_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          BUDGET_MIN: "330"
          SITE: ${{ matrix.site }}
          URL: ${{ inputs.url }}
          IA: ${{ inputs.ia }}
          FRESH: ${{ inputs.fresh && '1' || '' }}
          T_PDF: ${{ inputs.t_pdf }}
          T_AUDIO: ${{ inputs.t_audio }}
          T_VIDEO: ${{ inputs.t_video }}
          T_DOCS: ${{ inputs.t_docs }}
          TYPES_LIST: ${{ inputs.types_list }}
          MEASURE: ${{ inputs.measure }}
        shell: bash
        run: |
          exec > >(tee -a scan.log) 2>&1
          args=()
          [ -n "$FRESH" ] && args+=(--fresh)
          [ "$MEASURE" = "false" ] && args+=(--no-measure)
          t=""                                       # ticked boxes + the extra list; nothing at all = every type
          if [ "$T_PDF" = "true" ]; then t="$t,pdf"; fi
          if [ "$T_AUDIO" = "true" ]; then t="$t,mp3,m4a,wav,ogg,aac"; fi
          if [ "$T_VIDEO" = "true" ]; then t="$t,mp4,webm,mov"; fi
          if [ "$T_DOCS" = "true" ]; then t="$t,pdf,doc,docx,rtf,ppt,pptx,xls,xlsx,epub"; fi
          if [ -n "$TYPES_LIST" ]; then
            IFS=',' read -ra parts <<< "$TYPES_LIST"
            for p in "${parts[@]}"; do
              p="$(echo "$p" | tr 'A-Z' 'a-z' | tr -d ' .')"
              if [ "$p" = "all" ]; then t=""; break; fi
              if [ -n "$p" ]; then t="$t,$p"; fi
            done
          fi
          t="$(echo "${t#,}" | tr ',' '\n' | awk 'NF && !seen[$0]++' | paste -sd, -)"
          args+=(--store files)                      # CSV files in catalog/ (use --store d1 to write to Cloudflare D1)
          [ -n "$t" ] && args+=(--types "$t")
          if [ "$SITE" = "_extra" ]; then
            [ -n "$URL" ] && args+=(--url "$URL")
            [ -n "$IA" ] && args+=(--ia "$IA")
          else
            args+=(--sites "$SITE")
          fi
          python scripts/scan.py "${args[@]}"
      - name: Commit catalog
        if: always()
        shell: bash
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add -A catalog
          if git diff --cached --quiet; then echo "nothing new to commit"; exit 0; fi
          git commit -q -m "catalog: ${{ matrix.site }}"
          for i in 1 2 3 4 5 6; do                  # four jobs push at the same time: fetch, rebase, retry
            git fetch -q origin "${{ github.ref_name }}" && git rebase -q "origin/${{ github.ref_name }}" \
              && git push -q origin "HEAD:${{ github.ref_name }}" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 15 + 5))
          done
          echo "::error::could not push the catalog"; exit 1
      - name: Summary
        if: always()
        shell: bash
        env: {JOB_STATUS: "${{ job.status }}"}
        run: |
          python3 scripts/summary.py scan scan.log "scan: ${{ matrix.site }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Save progress
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scan_state
          key: scan-${{ matrix.site }}-${{ github.run_id }}
      - uses: 3Soroush/ghm-actions/ghm-summary-dump@c8aa2a303f21e132ea248eeb6a3678e1101a2df7
        if: always()
  index:
    needs: [plan, scan]
    if: always() && needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}      # the newest commit, with every site's files
      - run: python3 scripts/build_index.py
      - name: Commit index
        shell: bash
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add -A catalog
          if git diff --cached --quiet; then echo "index unchanged"; exit 0; fi
          git commit -q -m "catalog: index"
          for i in 1 2 3 4 5 6; do
            git fetch -q origin "${{ github.ref_name }}" && git rebase -q "origin/${{ github.ref_name }}" \
              && git push -q origin "HEAD:${{ github.ref_name }}" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 15 + 5))
          done
          echo "::error::could not push the index"; exit 1
      - uses: 3Soroush/ghm-actions/ghm-summary-dump@c8aa2a303f21e132ea248eeb6a3678e1101a2df7
        if: always()
