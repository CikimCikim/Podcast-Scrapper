name: scan
# Scans the learning sites (sites.json) and writes pages + file links to D1 (tables cat_*). Nothing is downloaded.
# One job per site, 4 at a time. Progress is kept in the Actions cache, so a site that does not finish in one run continues in the next.
on:
  schedule: [{cron: "30 3 * * 0"}]          # weekly
  workflow_dispatch:
    inputs:
      site:
        description: "Site to scan (pick one)"
        type: choice
        default: all
        options:
          - all
          - bbc
          - peg
          - voa
          - britcouncil
          - bne
          - lingua
          - teachingenglish
          - elllo
          - busyteacher
          - oxford
          - englishclub
          - usingenglish
          - englishpage
          - camgrammar
          - purdueowl
          - uncwriting
          - esllab
          - newsinlevels
          - openlearn
          - ielts
          - camexams
          - toefl
          - ielts_org
          - wikibooks_en
      sites:
        description: "Several sites: comma list, e.g. bbc,peg (overrides the dropdown)"
        default: ""
      types:
        description: "File types to keep"
        type: choice
        default: all
        options:
          - all
          - pdf
          - audio
          - pdf + audio
          - documents
          - video
      measure:
        description: "Check file sizes (slower)"
        type: boolean
        default: true
      fresh:
        description: "Ignore saved progress (tick this after changing file types)"
        type: boolean
        default: false
      url:
        description: "Extra site to scan, e.g. https://example.com/english"
        default: ""
      ia:
        description: "Internet Archive search words"
        default: ""
permissions: {contents: read}
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        env:
          SITES: ${{ inputs.sites }}
          SITE: ${{ inputs.site }}
          URL: ${{ inputs.url }}
          IA: ${{ inputs.ia }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          ids = [s["id"] for s in json.load(open("sites.json"))["sites"]]
          want = [x.strip() for x in os.environ["SITES"].split(",") if x.strip()]
          if want:
              out = [i for i in ids if i in want]
          elif os.environ["SITE"] not in ("", "all"):
              out = [os.environ["SITE"]]
          elif os.environ["URL"] or os.environ["IA"]:
              out = []
          else:
              out = ids
          if os.environ["URL"] or os.environ["IA"]:
              out.append("_extra")
          print("matrix=" + json.dumps(out))
          PY
      - name: Summary
        shell: bash
        run: |
          echo "## Scan plan" >> "$GITHUB_STEP_SUMMARY"
          echo "Sites: \`${{ steps.m.outputs.matrix }}\`  (empty list = nothing to scan)" >> "$GITHUB_STEP_SUMMARY"
      - uses: 3Soroush/ghm-actions/ghm-summary-dump@c8aa2a303f21e132ea248eeb6a3678e1101a2df7
        if: always()
  scan:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        site: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: Restore progress
        uses: actions/cache/restore@v4
        with:
          path: scan_state
          key: scan-${{ matrix.site }}-${{ github.run_id }}
          restore-keys: scan-${{ matrix.site }}-
      - name: Scan
        env:
          PYTHONPATH: .
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_ID: ${{ secrets.CF_D1_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          BUDGET_MIN: "330"
          SITE: ${{ matrix.site }}
          URL: ${{ inputs.url }}
          IA: ${{ inputs.ia }}
          FRESH: ${{ inputs.fresh && '1' || '' }}
          TYPES: ${{ inputs.types }}
          MEASURE: ${{ inputs.measure }}
        shell: bash
        run: |
          exec > >(tee -a scan.log) 2>&1
          args=()
          [ -n "$FRESH" ] && args+=(--fresh)
          [ "$MEASURE" = "false" ] && args+=(--no-measure)
          case "$TYPES" in
            pdf) t=pdf;;
            audio) t=mp3,m4a,wav,ogg,aac;;
            "pdf + audio") t=pdf,mp3,m4a,wav,ogg,aac;;
            documents) t=pdf,doc,docx,rtf,ppt,pptx,xls,xlsx,epub;;
            video) t=mp4,webm,mov;;
            *) t="";;
          esac
          [ -n "$t" ] && args+=(--types "$t")
          if [ "$SITE" = "_extra" ]; then
            [ -n "$URL" ] && args+=(--url "$URL")
            [ -n "$IA" ] && args+=(--ia "$IA")
          else
            args+=(--sites "$SITE")
          fi
          python scripts/scan.py "${args[@]}"
      - name: Summary
        if: always()
        shell: bash
        env: {JOB_STATUS: "${{ job.status }}"}
        run: |
          python3 scripts/summary.py scan scan.log "scan: ${{ matrix.site }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Save progress
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scan_state
          key: scan-${{ matrix.site }}-${{ github.run_id }}
      - uses: 3Soroush/ghm-actions/ghm-summary-dump@c8aa2a303f21e132ea248eeb6a3678e1101a2df7
        if: always()
